# Pre-commit hook: ROS 2 package.xml validator
# We set `pass_filenames: false` because the validator scans the entire package directory
# (reading CMakeLists.txt, launch files, etc.) to verify dependencies. It must run
# regardless of which specific file in the package triggered the commit.
-   id: format-package-xml
    name: Format package.xml
    description: Validate schema, enforce standard ordering, and sync dependencies with CMake and launch files.
    entry: package-xml-validator
    language: python
    pass_filenames: false
    args: [--compare-with-cmake, --auto-fill-missing-deps]

# Fails on a launch reference no manifest declares; warns about anything only a built
# workspace could have told it, so a runner without one is not a failure.
#
# `verbose: true` is load-bearing: pre-commit discards a passing hook's output, so without it
# every warning this prints would go nowhere. Pass --fatal-under PATH to treat an install space CI
# fills itself as yours to fix.
#
# `files` covers package.xml as well as the launch files, because dropping a dependency from a
# manifest is one of the two ways to create the finding this hook exists to catch - and a
# commit that only edits the manifest would otherwise never run it.
-   id: check-launch-tree
    name: Check launch tree references
    description: Follow every include from this package's launch files, and check that each manifest along the way declares what its launch files name.
    entry: check-launch-tree
    language: python
    pass_filenames: false
    verbose: true
    files: '(^|/)(launch|components|launch_manager_components|launch_manager_configs)/.*\.(py|xml|ya?ml|toml|launch)$|(^|/)package\.xml$'
